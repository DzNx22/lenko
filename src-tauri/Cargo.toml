[package]
name = "lenko"
version = "0.2.0"
description = "Mascote que avisa quando a IA de código termina"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# Pacotes .mascote (zip) e envio das imagens para o webview
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.23"

# Janela em primeiro plano: percebe quando o dev volta para o terminal (focus.rs)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

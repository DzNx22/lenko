<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LENKO</title>
<style>
  :root {
    --outline: #3B2A1E;
    --paper: #FDFBF4;
    --ink: #2A1D14;
    --alert: #C8553D;
    --leaf: #6E9E4F;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body {
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font: 700 12px/1.35 "Courier New", ui-monospace, monospace;
    color: var(--ink);
    -webkit-font-smoothing: none;
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 8px;
  }

  /* ---------- balão de fala com cantos em degrau ---------- */
  #bubble {
    position: relative;
    max-width: min(210px, calc(100vw - 20px));
    margin-bottom: 14px;
    padding: 8px 10px;
    background: var(--paper);
    box-shadow:
      0 -3px 0 0 var(--outline), 0 3px 0 0 var(--outline),
      -3px 0 0 0 var(--outline), 3px 0 0 0 var(--outline);
    cursor: pointer;
    opacity: 0; transform: translateY(6px);
    transition: opacity .15s steps(3), transform .15s steps(3);
    pointer-events: none;
  }
  #bubble.show { opacity: 1; transform: none; pointer-events: auto; }
  #bubble::after { /* rabinho em pixel */
    content: ""; position: absolute; left: 50%; bottom: -6px;
    width: 6px; height: 6px; margin-left: -3px;
    background: var(--paper);
    box-shadow: -3px 0 0 0 var(--outline), 3px 0 0 0 var(--outline), 0 3px 0 0 var(--outline);
  }
  #bubble .project { display: block; font-weight: 400; opacity: .7; margin-top: 2px; word-break: break-all; }
  #bubble .actions { display: flex; gap: 8px; margin-top: 8px; }
  #bubble .actions button {
    flex: 1; border: 0; padding: 4px 6px; cursor: pointer;
    font: inherit; color: var(--ink); background: var(--paper);
    box-shadow: 0 0 0 2px var(--outline);
  }
  #bubble .actions button.primary { background: var(--leaf); color: var(--paper); }
  #bubble .actions button:focus-visible { outline: 2px solid var(--leaf); outline-offset: 3px; }
  #bubble.alert { box-shadow:
      0 -3px 0 0 var(--alert), 0 3px 0 0 var(--alert),
      -3px 0 0 0 var(--alert), 3px 0 0 0 var(--alert); }
  #bubble.alert::after { box-shadow:
      -3px 0 0 0 var(--alert), 3px 0 0 0 var(--alert), 0 3px 0 0 var(--alert); }

  /* ---------- galho (arrasta a janela) e preguiça ---------- */
  #rig { position: relative; display: flex; flex-direction: column; align-items: center; }
  canvas { display: block; image-rendering: pixelated; }
  #branch { cursor: grab; }
  #sloth { transform-origin: 50% 0; cursor: pointer; }

  #zzz {
    position: absolute; right: -6px; top: 28px;
    color: var(--outline); font-size: 14px; letter-spacing: 2px;
    opacity: 0;
  }

  /* ---------- controles que aparecem no hover ---------- */
  #controls {
    position: absolute; top: 4px; right: 4px; display: flex; gap: 4px;
    z-index: 1; /* acima do #stage, que ocupa a janela toda */
    opacity: 0; transition: opacity .1s;
  }
  body:hover #controls { opacity: 1; }
  #controls button {
    width: 22px; height: 22px; border: 0; padding: 0;
    background: var(--paper); color: var(--ink);
    box-shadow: 0 0 0 2px var(--outline);
    font: inherit; font-size: 12px; cursor: pointer;
  }
  #controls button:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

  /* ---------- estados ---------- */
  .idle #sloth    { animation: sway 6s ease-in-out infinite; }
  .idle #zzz      { animation: zzz 3s steps(6) infinite; }
  .working #sloth, .asking #sloth { animation: sway 2.4s ease-in-out infinite; }
  .done #sloth    { animation: hop .5s steps(4) 3; }
  .waiting #sloth { animation: wiggle .25s steps(2) infinite; }

  @keyframes sway   { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes hop    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes wiggle { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }
  @keyframes zzz    { 0% { opacity: 0; transform: translate(0,0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(8px,-18px); } }

  @media (prefers-reduced-motion: reduce) {
    #sloth, #zzz { animation: none !important; }
    .idle #zzz { opacity: 1; }
  }
</style>
</head>
<body class="idle">
  <div id="controls">
    <button id="mute" title="Silenciar sons" aria-label="Silenciar sons">♪</button>
    <button id="quit" title="Fechar o LENKO" aria-label="Fechar o LENKO">×</button>
  </div>

  <div id="stage">
    <div id="bubble" role="status" aria-live="polite"></div>
    <div id="rig">
      <canvas id="branch" data-tauri-drag-region title="Arraste para mover"></canvas>
      <canvas id="sloth" title="Clique para dispensar"></canvas>
      <span id="zzz">z z</span>
    </div>
  </div>

<script>
/* ===================== MASCOTE (skin) ===================== */
// O desenho vem de um pacote de mascote (src/mascotes/preguica é o padrão):
// spritesheet + prop (o galho) + manifest dizendo os quadros de cada estado.
let SCALE = 5; // trocado pela bandeja (Tamanho)
let skin = null; // { manifest, sprites: Image, prop: Image, sounds: { done?, waiting? } }
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

const $ = id => document.getElementById(id);

function loadImage(src) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = fail;
    img.src = src;
  });
}

async function loadSkin() {
  const data = tauri
    ? await invoke('skin_get')
    : { // no navegador, lê a preguiça direto da pasta (precisa de um servidor: npm run preview)
        manifest: await (await fetch('mascotes/preguica/manifest.json')).json(),
        sprites: 'mascotes/preguica/sprites.png',
        prop: 'mascotes/preguica/prop.png',
        sounds: {},
      };
  const [sprites, prop] = await Promise.all([loadImage(data.sprites), loadImage(data.prop)]);
  skin = { manifest: data.manifest, sprites, prop, sounds: data.sounds || {} };
  $('sloth').title = `${skin.manifest.name}: clique para dispensar`;
  paintProp();
  restartAnim();
}

// Escala inteira e sem suavização, para o pixel art não borrar
function canvasFor(canvas, w, h) {
  if (canvas.width !== w * SCALE || canvas.height !== h * SCALE) {
    canvas.width = w * SCALE;
    canvas.height = h * SCALE;
  }
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  return ctx;
}

function paintProp() {
  const img = skin.prop;
  canvasFor($('branch'), img.width, img.height).drawImage(img, 0, 0, img.width * SCALE, img.height * SCALE);
}

// Quadros numerados da esquerda para a direita, de cima para baixo
function paintFrame(i) {
  const { width: w, height: h } = skin.manifest.frame;
  const cols = skin.sprites.width / w;
  canvasFor($('sloth'), w, h)
    .drawImage(skin.sprites, (i % cols) * w, Math.floor(i / cols) * h, w, h, 0, 0, w * SCALE, h * SCALE);
}

function setScale(value) {
  SCALE = value;
  if (skin) { paintProp(); restartAnim(); }
}

/* ===================== SOM 8-bit ===================== */
let muted = false, audio;
function chirp(notes) {
  if (muted) return;
  audio ??= new AudioContext();
  let t = audio.currentTime;
  for (const [freq, dur] of notes) {
    const osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = 'square'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.06, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(audio.destination);
    osc.start(t); osc.stop(t + dur);
    t += dur * 0.9;
  }
}
// Som do mascote, se o pacote trouxer; senão, o bipe 8-bit
function play(kind) {
  if (muted) return;
  const src = skin?.sounds[kind];
  if (!src) return chirp(SOUND[kind]);
  const audio = new Audio(src);
  audio.volume = 0.6;
  audio.play().catch(() => {});
}
const SOUND = {
  done:    [[523, .09], [659, .09], [784, .16]],
  waiting: [[784, .12], [523, .12], [784, .12], [523, .12]],
};

/* ===================== ESTADOS ===================== */
// Estado da preguiça → animação do manifest (a pergunta usa a cara de "terminei")
const ANIM = { idle: 'idle', working: 'working', done: 'done', waiting: 'waiting', asking: 'done' };
let state = 'idle', blinkTimer, nudgeTimer, animTimer, frameIdx = 0;
let seenDone = false; // o dev já dispensou o "Terminei!" desta tarefa

// Enquanto ninguém responde, a preguiça volta a chamar atenção (som + pulinho).
// Os intervalos vão espaçando para não virar um alarme; depois do último ela só fica esperando.
const NUDGE_DELAYS = [30, 60, 120, 300, 600].map(s => s * 1000);

function nudge(kind, step = 0) {
  clearTimeout(nudgeTimer);
  play(kind);
  const sloth = $('sloth');
  sloth.style.animation = 'none';
  void sloth.offsetWidth; // reinicia a animação do estado
  sloth.style.animation = '';
  if (step < NUDGE_DELAYS.length) {
    nudgeTimer = setTimeout(() => nudge(kind, step + 1), NUDGE_DELAYS[step]);
  }
}

function setState(next, text, project, alert = false) {
  state = next;
  document.body.className = next;
  clearTimeout(nudgeTimer);
  restartAnim();

  const bubble = $('bubble');
  if (text) {
    bubble.innerHTML = '';
    bubble.append(text);
    if (project) {
      const p = document.createElement('span');
      p.className = 'project'; p.textContent = project;
      bubble.append(p);
    }
    bubble.classList.toggle('alert', alert);
    bubble.classList.add('show');
  } else {
    bubble.classList.remove('show');
  }
}

const anim = () => skin.manifest.states[ANIM[state]];

// Mostra o primeiro quadro do estado e, se houver mais de um, anima no fps do manifest
function restartAnim() {
  clearInterval(animTimer);
  frameIdx = 0;
  if (!skin) return;
  const a = anim();
  paintFrame(a.frames[0]);
  if (a.frames.length > 1 && !reducedMotion.matches) {
    animTimer = setInterval(() => {
      frameIdx = (frameIdx + 1) % a.frames.length;
      paintFrame(a.frames[frameIdx]);
    }, 1000 / (a.fps || 4));
  }
  scheduleBlink();
}

// Piscadinha de vez em quando, se o estado tiver um quadro de piscada
function scheduleBlink() {
  clearTimeout(blinkTimer);
  const a = skin && anim();
  if (a?.blink == null) return;
  blinkTimer = setTimeout(() => {
    paintFrame(a.blink);
    setTimeout(() => {
      if (anim() === a) paintFrame(a.frames[frameIdx]);
      scheduleBlink();
    }, 140);
  }, 2500 + Math.random() * 3000);
}

function onEvent(ev) {
  if (state === 'asking') return; // não atropela a pergunta de conexão
  const project = ev.project || '';
  switch (ev.type) {
    case 'working':
      // Chega a cada ferramenta usada; só redesenha se mudou alguma coisa
      if (state === 'working' && $('bubble').querySelector('.project')?.textContent === project) break;
      seenDone = false;
      setState('working', '…', project);
      break;
    case 'done':
      // Repetido (ex.: lembrete de ociosidade) não reinicia a sequência de avisos
      if (state === 'done' || seenDone) break;
      setState('done', 'Terminei!', project);
      nudge('done');
      break;
    case 'waiting':
      setState('waiting', ev.message || 'Preciso de você aqui.', project, true);
      nudge('waiting');
      break;
  }
}

/* ===================== CONEXÃO COM O CLAUDE CODE ===================== */
// No navegador (sem Tauri) os botões só simulam a resposta
const invoke = (cmd, args) => tauri ? tauri.core.invoke(cmd, args) : Promise.resolve();

// Balão com dois botões. Enquanto está aberto, eventos da IA não o atropelam.
function ask(question, yesLabel, noLabel, onYes, onNo) {
  const text = document.createDocumentFragment();
  text.append(question);
  const actions = document.createElement('div');
  actions.className = 'actions';
  const yes = Object.assign(document.createElement('button'), { className: 'primary', textContent: yesLabel });
  const no = Object.assign(document.createElement('button'), { textContent: noLabel });
  actions.append(yes, no);
  text.append(actions);
  setState('asking', text);
  yes.addEventListener('click', onYes);
  no.addEventListener('click', onNo);
  yes.focus();
}

function fail(err) {
  setState('waiting', String(err), '', true);
  play('waiting');
}

function askToConnect() {
  ask('Quer que eu me conecte ao Claude Code?', 'Conectar', 'Agora não',
    async () => {
      try {
        await invoke('claude_connect');
        setState('done', 'Conectado! Reinicie o Claude Code para valer.');
        play('done');
      } catch (err) { fail(err); }
    },
    async () => {
      try { await invoke('claude_decline'); } catch {}
      rest();
    });
}

/* ===================== ATUALIZAÇÃO ===================== */
// Só pergunta quando a preguiça está à toa; senão guarda para depois do próximo descanso.
let pendingUpdate = null;

function offerUpdate(version) {
  pendingUpdate = version;
  if (state === 'idle') askToUpdate();
}

function askToUpdate() {
  const version = pendingUpdate;
  pendingUpdate = null;
  ask(`Tenho uma atualização! (v${version})`, 'Atualizar', 'Depois',
    async () => {
      setState('working', 'Baixando a atualização…');
      try { await invoke('update_install'); } // reinicia o app se der certo
      catch (err) { fail(err); }
    },
    () => setState('idle'));
}

// Volta a descansar e, se uma atualização ficou esperando, pergunta agora.
function rest() {
  setState('idle');
  if (pendingUpdate) askToUpdate();
}

/* ===================== INTERAÇÃO ===================== */
const dismiss = () => {
  if (state === 'asking') return; // só sai pelos botões
  if (state === 'done') seenDone = true;
  rest();
};
$('bubble').addEventListener('click', dismiss);
$('sloth').addEventListener('click', dismiss);
function setMuted(value) {
  muted = value;
  $('mute').textContent = muted ? '–' : '♪';
  $('mute').title = muted ? 'Ativar sons' : 'Silenciar sons';
}
$('mute').addEventListener('click', () => {
  setMuted(!muted);
  invoke('muted_set', { muted }).catch(() => {});
});

// Voltou para o terminal/editor: já viu que terminou, então dispensa;
// se é um pedido de aprovação, mantém o balão mas para de insistir.
function onDevFocus() {
  if (state === 'done') dismiss();
  else if (state === 'waiting') clearTimeout(nudgeTimer);
}

/* ===================== INSTALAR MASCOTE ===================== */
async function installSkin(paths) {
  if (state === 'asking') return;
  const file = paths.find(p => p.toLowerCase().endsWith('.mascote'));
  if (!file) return fail('Só sei instalar arquivos .mascote.');
  setState('working', 'Instalando…');
  try {
    const name = await invoke('skin_install', { path: file });
    await loadSkin();
    setState('done', `Pronto! Agora eu sou ${name}.`);
    play('done');
  } catch (err) { fail(err); }
}

// Resultado de conectar/desconectar pela bandeja (também encerra a pergunta, se aberta)
function onNotice({ ok, text }) {
  if (ok) { setState('done', text); play('done'); }
  else { setState('waiting', text, '', true); play('waiting'); }
}

const tauri = window.__TAURI__;
if (tauri) {
  tauri.event.listen('ai-event', e => onEvent(e.payload));
  tauri.event.listen('notice', e => onNotice(e.payload));
  tauri.event.listen('dev-focus', onDevFocus);
  tauri.event.listen('skin', () => loadSkin().catch(fail)); // trocado pela bandeja
  tauri.webview.getCurrentWebview().onDragDropEvent(e => {
    if (e.payload.type === 'drop') installSkin(e.payload.paths);
  });
  tauri.event.listen('muted', e => setMuted(e.payload));
  invoke('muted_get').then(setMuted).catch(() => {});
  tauri.event.listen('scale', e => setScale(e.payload));
  tauri.event.listen('update-available', e => offerUpdate(e.payload));
  invoke('scale_get').then(setScale).catch(() => {});
  tauri.core.invoke('claude_should_ask').then(ask => ask && askToConnect());
  $('quit').addEventListener('click', () => tauri.window.getCurrentWindow().close());
} else {
  // Abrindo direto no navegador: teclas 1–4 simulam eventos
  $('quit').hidden = true;
  document.body.style.background = '#9DB4C0';
  addEventListener('keydown', e => ({
    '1': () => setState('idle'),
    '2': () => onEvent({ type: 'working', project: 'meu-projeto' }),
    '3': () => onEvent({ type: 'done', project: 'meu-projeto' }),
    '4': () => onEvent({ type: 'waiting', project: 'meu-projeto', message: 'Posso rodar npm install?' }),
    '5': () => askToConnect(),
    '6': () => offerUpdate('9.9.9'),
    '7': () => onDevFocus(), // simula voltar para o terminal
  })[e.key]?.());
}

setState('idle');
loadSkin().catch(err => console.error('Não consegui carregar o mascote:', err));
</script>
</body>
</html>

# Gera os instaladores (Windows, macOS, Linux) e cria um rascunho de Release
# sempre que uma tag de versão é enviada: git tag v0.1.0 && git push --tags
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           obrigatório: assina os pacotes do atualizador
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  senha da chave acima
#   WINDOWS_CERTIFICATE                 opcional: certificado .pfx em base64
#   WINDOWS_CERTIFICATE_PASSWORD        opcional: senha do .pfx
# Sem o certificado do Windows o build continua, só que com instalador não assinado.
#
# O atualizador só enxerga releases publicadas: revise o rascunho e clique em Publish.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      # Secrets não podem ir direto num `if`; este sinalizador pode
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v5

      - name: Dependências do sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm install

      # Importa o certificado e passa a impressão digital ao Tauri pelo TAURI_CONFIG.
      # Pulado enquanto o secret não existir.
      - name: Certificado de assinatura (Windows)
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 4 -Compress
          "TAURI_CONFIG=$config" >> $env:GITHUB_ENV

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'LENKO v__VERSION__'
          releaseBody: |
            Baixe o instalador do seu sistema em **Assets**, logo abaixo:

            - **Windows:** `LENKO_..._x64-setup.exe`
            - **macOS (Apple Silicon):** `LENKO_..._aarch64.dmg`
            - **macOS (Intel):** `LENKO_..._x64.dmg`
            - **Linux:** `.AppImage` (qualquer distribuição), `.deb` (Ubuntu/Debian) ou `.rpm` (Fedora)

            Os arquivos `.sig`, `.tar.gz` e `latest.json` são usados pela atualização automática; não precisa baixar.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true # publica o latest.json lido pelo atualizador
